services:
  - type: web
    name: smart-campus-complaint-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-campus-db
          property: connectionString

databases:
  - name: smart-campus-db
    databaseName: smart_campus_db
    user: campus_user
    plan: free