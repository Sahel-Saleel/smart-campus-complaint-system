<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Campus Voice</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container" style="margin-top: 4rem;">

            <a href="{{ url_for('home') }}" class="btn btn-primary" style="display: inline-block;">← Go Home</a>
        </div>
    </div>
