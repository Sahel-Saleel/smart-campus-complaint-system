<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login OTP Verification - Campus Voice</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body.auth-page {
            background-color: #080c16 !important;
            color: #f8fafc !important;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .auth-container {
            width: 100%;
            max-width: 460px;
            padding: 20px;
        }
        .auth-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .auth-card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1e293b;
        }
        .auth-icon {
            font-size: 2.2rem;
            background: rgba(59, 130, 246, 0.15);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .auth-card-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .auth-card-header h2 {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 400;
        }
        .otp-display-badge {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }
        .otp-display-badge strong {
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: #10b981;
            display: inline-block;
            margin-left: 6px;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border-left: 4px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.9rem;
        }
        .info-alert {
            background: rgba(59, 130, 246, 0.15);
            border-left: 4px solid #3b82f6;
            color: #93c5fd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1.3rem;
            letter-spacing: 6px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .actions-footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .actions-footer a {
            color: #60a5fa;
            text-decoration: none;
        }
        .actions-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-card-header">
                <div class="auth-icon">🔐</div>
                <div>
                    <h1>Login OTP Verification</h1>
                    <h2>Admin / HOD Authentication Step</h2>
                </div>
            </div>

            {% if email %}
                <div class="otp-display-badge">
                    📲 Verification OTP sent to <strong>{{ email }}</strong>
                </div>
            {% endif %}

            {% if errors %}
                <div class="alert-error">
                    {% for error in errors %}
                        <p>✗ {{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            {% if info_message %}
                <div class="info-alert">
                    ℹ {{ info_message }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.verify_login_otp') }}" class="auth-form">
                <div class="form-group">
                    <label for="otp_code">Enter 6-Digit OTP Code</label>
                    <input type="text" id="otp_code" name="otp_code" maxlength="6" pattern="\d{6}" required autofocus placeholder="123456">
                </div>

                <button type="submit" class="btn-submit">Verify & Complete Login</button>

                <div class="actions-footer">
                    <a href="{{ url_for('auth.resend_login_otp') }}">🔄 Resend OTP Code</a>
                    <a href="{{ url_for('auth.login') }}">← Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
