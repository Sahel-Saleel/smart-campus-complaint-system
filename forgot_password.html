<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Campus Voice</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .btn-secondary {
            display: inline-block;
            margin-top: 1rem;
            text-align: center;
            width: 100%;
        }
        .info-alert {
            padding: 1rem;
            background: rgba(37, 99, 235, 0.15);
            border-left: 4px solid var(--primary-color);
            color: #dbeafe;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        body[data-theme="light"] .info-alert {
            background: #e6f4ff;
            color: #0056b3;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-card-header">
                <div class="auth-icon">🔑</div>
                <div>
                    <h1>Forgot Password</h1>
                    <h2>Reset account password</h2>
                </div>
            </div>

            {% if errors %}
                <div class="alert alert-error">
                    {% for error in errors %}
                        <p>✗ {{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            {% if success_message %}
                <div class="info-alert" style="border-color: var(--success-color); color: var(--success-color);">
                    ✓ {{ success_message }}
                </div>
            {% endif %}

            {% if info_message %}
                <div class="info-alert">
                    ℹ {{ info_message }}
                </div>
            {% endif %}

            <form method="POST" class="auth-form" id="forgotPasswordForm">
                <div class="form-group">
                    <label for="registration_number">Registration Number / Username</label>
                    <input type="text" id="registration_number" name="registration_number" required autofocus placeholder="e.g. SPT24CS001, TS123, or NT001">
                </div>

                <button type="submit" class="btn">Submit Reset Request</button>
                <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">Back to Login</a>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            const regInput = document.getElementById('registration_number');
            regInput.value = regInput.value.toUpperCase().trim();
        });
    </script>
</body>
</html>
